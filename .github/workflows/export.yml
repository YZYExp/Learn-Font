name: Export EPUB
on:
  push:
    branches: [main]
    paths: ['book.json', 'chapters/**', 'appendices/**', 'assets/images/**', 'assets/designs/**', 'references/**', 'scripts/build_epub.py', 'scripts/check_book.py', 'requirements-export.txt', '.github/workflows/export.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: export-${{ github.ref }}
  cancel-in-progress: true
jobs:
  epub:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-export.txt
      - run: 'python -m pip install --only-binary=:all: -r requirements-export.txt'
      - name: Export and validate EPUB
        run: |
          python scripts/check_book.py
          python scripts/build_epub.py
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: font-atlas-epub
          path: build/*.epub
          if-no-files-found: error
          retention-days: 30
