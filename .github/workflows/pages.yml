name: Publish reading site
on:
  push:
    branches: [main]
    paths: ['book.json', 'chapters/**', 'appendices/**', 'references/**', 'assets/images/**', 'assets/designs/**', 'site/**', 'scripts/build_site.py', 'scripts/check_site.py', 'scripts/book_fingerprint.py', 'requirements-site.txt', 'downloads/**', '.github/workflows/pages.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-site.txt
      - run: 'python -m pip install --only-binary=:all: -r requirements-site.txt'
      - name: Build reading site
        run: python scripts/build_site.py --base-path /Learn-Font/ --output build/site --epub downloads/font-atlas.epub
      - name: Validate site links
        run: python scripts/check_site.py --base-path /Learn-Font/ --output build/site
      - uses: actions/upload-pages-artifact@v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: build/site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
